product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - org.jetbrains.compose.material:material-icons-core:1.7.3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.kotlinx.collections.immutable
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.ktor.client.logging
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.sqldelight.runtime
  - $libs.sqldelight.coroutines
  - $libs.coil.compose
  - $libs.coil.network.ktor
  - $libs.qrose
  - $libs.navigation.compose
  - $libs.napier

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.okhttp
  - $libs.koin.android
  - $libs.sqldelight.android.driver
  - $libs.litertlm.android
  - $libs.litert.runtime
  - $libs.litert.gpu

dependencies@ios:
  - $libs.ktor.client.darwin
  - $libs.sqldelight.native.driver

settings:
  kotlin:
    serialization: enabled
  compose:
    enabled: true
    resources:
      packageName: com.snehonir.lipirx.resources
      exposedAccessors: true
