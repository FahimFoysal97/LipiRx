  - $libs.androidx.activity.compose
  - $libs.androidx.appfunctions
  - $libs.koin.core
  - $libs.koin.android
  - $libs.litertlm.android
  - $libs.litert.runtime
  - $libs.litert.gpu
  - $compose.preview
  - $compose.uiTooling
